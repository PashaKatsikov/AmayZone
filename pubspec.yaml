name: amay_zone
description: "Amay Zone - social slot game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  shared_preferences: ^2.5.6
  ffi: ^2.2.0
  webview_flutter_android: ^4.14.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/loading/
    - assets/images/branding/
    - assets/images/backgrounds/
    - assets/images/frame/
    - assets/images/symbols/
    - assets/images/ui/

  fonts:
    - family: RussoOne
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
